databases:
  - name: cfb-boardgame-db
    databaseName: cfb_boardgame
    user: cfb_boardgame

services:
  - type: web
    name: cfb-boardgame
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cfb-boardgame-db
          property: connectionString
      - key: NODE_VERSION
        value: 20
